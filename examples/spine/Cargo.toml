[package]
name = "spine"
version = "0.1.0"
edition = "2021"
description = "CC: Tweaked wasm module (generated by `ccwasm new`)"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
aada = { path = "E:/project/aada/aada" }
cc_wasm_api = { path = "../../../cc_wasm_api", default-features = false, features = [
    "coroutine",
    "eval",
    "addon",
    "debug",
] }
image = "0.25.10"

[profile.dev]
opt-level = 3
