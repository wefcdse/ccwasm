plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.144'
    id 'idea'
}

group = project.mod_group_id
version = project.mod_version
base.archivesName = project.mod_id

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            mod_id                 : project.mod_id,
            mod_name               : project.mod_name,
            mod_license            : project.mod_license,
            mod_version            : project.mod_version,
            mod_authors            : project.mod_authors,
            loader_version_range   : loader_version_range,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

repositories {
    maven {
        url "https://maven.squiddev.cc/"
        content {
            includeGroup("cc.tweaked")
            includeModule("org.squiddev", "Cobalt")
        }
    }
}

neoForge {
    version = neo_version

    parchment {
        mappingsVersion = parchment_mappings_version
        minecraftVersion = parchment_minecraft_version
    }

    mods {
        "${mod_id}" { sourceSet(sourceSets.main) }
    }

    runs {
        client {
            client()
        }
        server {
            server()
        }
    }
}

dependencies {
    compileOnly "cc.tweaked:cc-tweaked-1.21.1-forge-api:1.117.1"
    implementation "cc.tweaked:cc-tweaked-1.21.1-forge:1.117.1"

    // javax.annotation.Nullable (not shipped with the JDK since Java 11)
    compileOnly 'com.google.code.findbugs:jsr305:3.0.2'

    jarJar(implementation "com.dylibso.chicory:runtime:1.7.5")
    jarJar(implementation "com.dylibso.chicory:compiler:1.7.5")
    jarJar(implementation "com.dylibso.chicory:wasi:1.7.5")
    jarJar(implementation "com.dylibso.chicory:wasm:1.7.5")
    jarJar(implementation "com.dylibso.chicory:log:1.7.5")
    jarJar(implementation "com.dylibso.chicory:dircache-experimental:1.7.5")

    additionalRuntimeClasspath "com.dylibso.chicory:runtime:1.7.5"
    additionalRuntimeClasspath "com.dylibso.chicory:compiler:1.7.5"
    additionalRuntimeClasspath "com.dylibso.chicory:wasi:1.7.5"
    additionalRuntimeClasspath "com.dylibso.chicory:wasm:1.7.5"
    additionalRuntimeClasspath "com.dylibso.chicory:log:1.7.5"
    additionalRuntimeClasspath "com.dylibso.chicory:dircache-experimental:1.7.5"
}

// NeoForge 21.1.229 pins org.ow2.asm to {strictly 9.8} on its apiElements, but
// Chicory 1.7.5's compiler needs ASM 9.9.1. Override every ASM module to 9.9.1
// so the two can coexist on the compile classpath. Chicory bundles its own ASM
// via jarJar, so this does not affect NeoForge's runtime copy.
configurations.configureEach {
    resolutionStrategy.eachDependency { details ->
        if (details.requested.group == 'org.ow2.asm') {
            details.useVersion('9.9.1')
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
    it.options.compilerArgs += ["-Xlint:unchecked", "-Xlint:deprecation"]
}

java {
    withSourcesJar()

    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

tasks.named('wrapper') {
    distributionType = Wrapper.DistributionType.ALL
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

def licenseName = "LICENSE_" + mod_id

jar {
    from("LICENSE") {
        rename { _ -> licenseName }
    }
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.mod_id
            from components.java
        }
    }
    repositories {
    }
}
